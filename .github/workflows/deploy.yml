name: Check and deploy

# Every push to main runs the consistency checker and, only if it passes,
# publishes the site to GitHub Pages. A broken edit fails the build instead of
# going live.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push supersede an in-flight run, but never cancel a deploy midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify links, anchors, and shared markup
        run: python check.py
      - name: Fail if sitemap.xml is stale
        run: |
          python check.py --write-sitemap
          git diff --exit-code -- sitemap.xml \
            || (echo "::error::sitemap.xml is out of date. Run: python check.py --write-sitemap" && exit 1)

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
